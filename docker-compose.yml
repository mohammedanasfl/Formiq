services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: formiq
      POSTGRES_USER: formiq
      POSTGRES_PASSWORD: formiq
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./docker/postgres/create-test-database.sql:/docker-entrypoint-initdb.d/create-test-database.sql:ro

volumes:
  postgres_data:
